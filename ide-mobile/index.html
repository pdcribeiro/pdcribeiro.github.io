<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
  <title>Mobile IDE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      font-size: 14px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #app {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 16px;
      overflow-y: auto;
    }

    .section { display: flex; flex-direction: column; gap: 8px; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #858585;
    }

    .row { display: flex; gap: 8px; align-items: stretch; }

    input {
      flex: 1;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
      min-width: 0;
    }
    input:focus { border-color: #0e639c; }

    button {
      background: #0e639c;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 12px;
      white-space: nowrap;
    }
    button:active { background: #1177bb; }

    .error {
      color: #f48771;
      font-size: 13px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      max-height: 55dvh;
    }

    .file-item {
      padding: 7px 10px;
      background: #252525;
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-item:active { background: #2a2d2e; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/vanjs-core@1.5.2/src/van.min.js"></script>
  <script>
    const { div, h2, input, button, p, span } = van.tags;

    const state = {
      token: van.state(localStorage.getItem("token") || ""),
      repo:  van.state(localStorage.getItem("repo")  || ""),
      tree:  van.state([]),
      error: van.state(""),
    };

    function saveToken(val) {
      state.token.val = val;
      localStorage.setItem("token", val);
    }

    function saveRepo(val) {
      state.repo.val = val;
      localStorage.setItem("repo", val);
    }

    async function loadTree() {
      state.error.val = "";
      state.tree.val = [];
      const parts = state.repo.val.trim().split("/");
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        state.error.val = "repo must be owner/name";
        return;
      }
      const [owner, name] = parts;
      try {
        const res = await fetch(
          `https://api.github.com/repos/${owner}/${name}/git/trees/main?recursive=1`,
          { headers: { Authorization: `Bearer ${state.token.val}` } }
        );
        if (res.status === 401) { state.error.val = "invalid token"; return; }
        if (res.status === 404) { state.error.val = "repo not found"; return; }
        if (!res.ok) { state.error.val = `error ${res.status}`; return; }
        const data = await res.json();
        state.tree.val = (data.tree || [])
          .filter(n => n.type === "blob")
          .map(n => ({ path: n.path, sha: n.sha }));
      } catch {
        state.error.val = "network error";
      }
    }

    const tokenInput = input({ type: "password", placeholder: "GitHub fine-grained PAT", value: state.token.val });
    const repoInput  = input({ type: "text",     placeholder: "owner/name",               value: state.repo.val });

    van.add(document.getElementById("app"),
      div({ class: "section" },
        h2({ class: "section-title" }, "Auth"),
        div({ class: "row" },
          tokenInput,
          button({ onclick: () => saveToken(tokenInput.value) }, "Save")
        )
      ),
      div({ class: "section" },
        h2({ class: "section-title" }, "Repo"),
        div({ class: "row" },
          repoInput,
          button({ onclick: () => { saveRepo(repoInput.value); loadTree(); } }, "Load")
        ),
        () => state.error.val ? p({ class: "error" }, state.error.val) : span()
      ),
      () => {
        const tree = state.tree.val;
        if (!tree.length) return span();
        return div({ class: "section" },
          h2({ class: "section-title" }, `Files (${tree.length})`),
          div({ class: "file-list" },
            ...tree.map(f => div({ class: "file-item" }, f.path))
          )
        );
      }
    );
  </script>
</body>
</html>
