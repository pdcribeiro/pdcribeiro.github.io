<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com">
  <title>Mobile IDE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      font-size: 14px;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #app {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 16px;
      overflow-y: auto;
    }

    .section { display: flex; flex-direction: column; gap: 8px; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #858585;
    }

    .row { display: flex; gap: 8px; align-items: stretch; }

    input {
      flex: 1;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
      min-width: 0;
    }
    input:focus { border-color: #0e639c; }

    button {
      background: #0e639c;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      padding: 8px 12px;
      white-space: nowrap;
    }
    button:active { background: #1177bb; }

    .error { color: #f48771; font-size: 13px; }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      max-height: 55dvh;
    }

    .file-item {
      padding: 7px 10px;
      background: #252525;
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .file-item:active { background: #2a2d2e; }

    #error-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }

    .error-toast {
      background: #5a1d1d;
      border-bottom: 2px solid #f48771;
      color: #f1c5bb;
      font-size: 13px;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      word-break: break-word;
    }

    .error-toast-msg { flex: 1; }

    .error-toast-close {
      background: none;
      border: none;
      color: #f48771;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="error-overlay"></div>
  <div id="app"></div>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.6.0.nomodule.min.js"></script>
  <script>
    // error overlay — plain DOM so it works even if van.js fails to load

    function formatError(err) {
      return err instanceof Error ? `${err.name}: ${err.message}` : String(err);
    }

    (function () {
      const overlay = document.getElementById("error-overlay");

      function showError(msg) {
        const text = document.createElement("span");
        text.className = "error-toast-msg";
        text.textContent = msg;

        const close = document.createElement("button");
        close.className = "error-toast-close";
        close.textContent = "×";
        close.setAttribute("aria-label", "dismiss");

        const toast = document.createElement("div");
        toast.className = "error-toast";
        toast.append(text, close);
        close.onclick = () => toast.remove();
        overlay.appendChild(toast);
      }

      window.onerror = (_msg, _src, _line, _col, err) => {
        showError(formatError(err || _msg));
        return false;
      };
      window.addEventListener("unhandledrejection", e => showError(formatError(e.reason)));
    })();

    // state

    const { div, h2, input, button, p, span } = van.tags;

    function persist(key) {
      const s = van.state(localStorage.getItem(key) || "");
      s.save = val => { s.val = val; localStorage.setItem(key, val); };
      return s;
    }

    const state = {
      token: persist("token"),
      repo:  persist("repo"),
      tree:  van.state([]),
      error: van.state(""),
    };

    // api

    async function fetchTree(owner, repo) {
      const res = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`,
        { headers: { Authorization: `Bearer ${state.token.val}` } }
      );
      if (res.status === 401) throw new Error("invalid token");
      if (res.status === 404) throw new Error("repo not found");
      if (!res.ok) throw new Error(`error ${res.status}`);
      const data = await res.json();
      return (data.tree || [])
        .filter(n => n.type === "blob")
        .map(n => ({ path: n.path, sha: n.sha }));
    }

    async function loadTree() {
      state.error.val = "";
      state.tree.val = [];
      const [owner, name, ...rest] = state.repo.val.trim().split("/");
      if (!owner || !name || rest.length) {
        state.error.val = "repo must be owner/name";
        return;
      }
      try {
        state.tree.val = await fetchTree(owner, name);
      } catch (e) {
        state.error.val = e.message;
      }
    }

    // components

    function Section(title, ...children) {
      return div({ class: "section" },
        h2({ class: "section-title" }, title),
        ...children
      );
    }

    function AuthSection() {
      const tokenInput = input({ type: "password", placeholder: "GitHub fine-grained PAT", value: state.token.val });
      return Section("Auth",
        div({ class: "row" },
          tokenInput,
          button({ onclick: () => state.token.save(tokenInput.value) }, "Save")
        )
      );
    }

    function RepoSection() {
      const repoInput = input({ type: "text", placeholder: "owner/name", value: state.repo.val });
      return Section("Repo",
        div({ class: "row" },
          repoInput,
          button({ onclick: () => { state.repo.save(repoInput.value); loadTree(); } }, "Load")
        ),
        () => state.error.val ? p({ class: "error" }, state.error.val) : span()
      );
    }

    function FileList() {
      return () => {
        const tree = state.tree.val;
        if (!tree.length) return span();
        return Section(`Files (${tree.length})`,
          div({ class: "file-list" },
            ...tree.map(f => div({ class: "file-item" }, f.path))
          )
        );
      };
    }

    // mount

    van.add(document.getElementById("app"), AuthSection(), RepoSection(), FileList());
  </script>
</body>
</html>
